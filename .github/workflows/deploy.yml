name: Deploy to DigitalOcean

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Setup SSH key for DigitalOcean
      uses: webfactory/ssh-agent@v0.5.3
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}  # Ensure SSH key is correct in GitHub Secrets

    - name: Copy files to DigitalOcean
      run: |
        scp -r * ubuntu@${{ secrets.DROPLET_IP }}:/var/www/html/cse135hw
      env:
        DROPLET_IP: ${{ secrets.DROPLET_IP }}

    - name: Restart Apache to apply changes
      run: |
        ssh -o StrictHostKeyChecking=no ubuntu@${{ secrets.DROPLET_IP }} "sudo systemctl restart apache2"
      env:
        DROPLET_IP: ${{ secrets.DROPLET_IP }}
